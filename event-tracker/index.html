<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Event Tracker</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 10h17M8 2.5v4.5M16 2.5v4.5M8 15l2.5 2.5L16 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div>
          <h1 data-i18n="appTitle"></h1>
          <p class="tagline" data-i18n="tagline"></p>
        </div>
      </div>
      <div class="actions">
        <div class="seg" role="group" aria-label="Language / 语言">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="zh">中文</button>
        </div>
        <details class="menu" id="backupMenu">
          <summary class="btn" data-i18n="backup"></summary>
          <div class="menu-pop">
            <button type="button" id="exportBtn" data-i18n="exportBackup"></button>
            <button type="button" id="importBtn" data-i18n="importBackup"></button>
          </div>
        </details>
        <button type="button" class="btn" id="githubBtn">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.34c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.72 1.22 1.87.87 2.33.67.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0z"/></svg>
          <span id="githubLabel"></span>
          <span class="sync-dot" id="syncDot" data-state="off" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap shell" id="shell" data-view="list">
    <aside class="sidebar">
      <button type="button" class="btn primary block" id="newEventBtn" data-fk="new-event">
        <span aria-hidden="true">+</span> <span data-i18n="newEvent"></span>
      </button>
      <input type="search" id="search" class="search" data-i18n-ph="searchPh" data-i18n-aria="searchPh">
      <nav id="list" class="event-list"></nav>
      <p class="storage-note" id="storageNote" role="status"></p>
    </aside>
    <section id="detail" class="detail"></section>
  </main>

  <input type="file" id="filePicker" multiple hidden>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <dialog id="dlg"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="i18n.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
